plugins {
    id 'com.android.application'
}

android {
    namespace 'com.esnexius.sitemanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.esnexius.sitemanager'
        minSdk 28
        targetSdk 28
        versionCode 4
        versionName '2.0.0-android9'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
        release {
            def ks = System.getenv('ESNEXIUS_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ESNEXIUS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ESNEXIUS_KEY_ALIAS')
                keyPassword System.getenv('ESNEXIUS_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (System.getenv('ESNEXIUS_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
