name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-manager/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-manager
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-manager/app/build/outputs/apk/debug/app-debug.apk EsnexiusSiteManager.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EsnexiusSiteManager
          path: EsnexiusSiteManager.apk
          if-no-files-found: error
